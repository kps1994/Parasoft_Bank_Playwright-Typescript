name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Ensure HTML report is generated
      - name: Run Playwright tests (HTML report)
        run: npx playwright test --reporter=html

      # Optional: upload report as artifact too
      - name: Upload Playwright report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Zip the HTML report for email attachment
      - name: Zip HTML report
        if: always() # still zip even if tests fail so you can see failures
        run: |
          cd playwright-report
          zip -r ../playwright-report.zip .
          cd ..

      # Send email with the HTML report attached
      - name: Send Playwright report via Email
        if: always() # send even on failures
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          subject: |
            Playwright Test Report - ${{ github.repository }} @ ${{ github.ref_name }} (#${{ github.run_number }}) [${{ job.status }}]
          to: mechsiva0@gmail.com
          from: Playwright CI <${{ secrets.SMTP_USERNAME }}>
          # You can attach the zip; many mail clients block raw folders
          attachments: |
            playwright-report.zip
          # Optional: include a brief summary in the email body
          html_body: |
            <h3>Playwright CI Report</h3>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Branch/Ref:</b> ${{ github.ref_name }}</p>
            <p><b>Run:</b> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{un_id }}View in GitHub Actions</a></p>
            <p><b>Status:</b> ${{ job.status }}</p>
            <p>The full HTML report is attached as <code>playwright-report.zip</code>. Unzip and open <code>index.html</code>.</p>
